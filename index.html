<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Login | Secure Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff00;
            overflow: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Matrix background effect */
        #matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: glitch 2s infinite;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px #0088cc);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
            letter-spacing: 3px;
        }

        .subtitle {
            color: #00cc66;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .login-form {
            background-color: rgba(10, 10, 10, 0.8);
            border: 1px solid #00ff00;
            border-radius: 5px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: #111;
            border: 1px solid #00ff00;
            border-radius: 3px;
            color: #00ff00;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 3px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #00aaff;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.7);
        }

        .telegram-links {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            font-size: 0.9rem;
        }

        .telegram-links a {
            color: #0088cc;
            text-decoration: none;
            transition: color 0.3s;
        }

        .telegram-links a:hover {
            color: #00aaff;
            text-decoration: underline;
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #00cc66;
        }

        /* Glitch animation */
        @keyframes glitch {
            0% {
                text-shadow: 2px 2px 0 #ff00ff, -2px -2px 0 #00ffff;
            }
            25% {
                text-shadow: -2px 2px 0 #ff00ff, 2px -2px 0 #00ffff;
            }
            50% {
                text-shadow: 2px -2px 0 #ff00ff, -2px 2px 0 #00ffff;
            }
            75% {
                text-shadow: -2px -2px 0 #ff00ff, 2px 2px 0 #00ffff;
            }
            100% {
                text-shadow: 2px 2px 0 #ff00ff, -2px -2px 0 #00ffff;
            }
        }

        /* Terminal typing effect */
        .typing {
            overflow: hidden;
            border-right: 2px solid #00ff00;
            white-space: nowrap;
            margin: 0 auto;
            animation: typing 3.5s steps(40, end), blink-caret 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #00ff00 }
        }

        /* Scan line effect */
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #00ff00, transparent);
            animation: scan 3s linear infinite;
            z-index: 2;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }
    </style>
</head>
<body>
    <!-- Matrix background -->
    <canvas id="matrix-bg"></canvas>
    
    <!-- Scan line effect -->
    <div class="scan-line"></div>
    
    <div class="container">
        <div class="header">
            <!-- Telegram Logo -->
            <svg class="logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
                <circle cx="120" cy="120" r="120" fill="#0088cc"/>
                <path d="M81.229,128.772l14.237,39.406s1.78,3.687,3.686,3.687,30.255-29.492,30.255-29.492l31.525-60.89L81.737,118.6Z" fill="#fff"/>
                <path d="M100.106,138.878l-2.733,29.046s-1.144,8.9,7.754,0,17.415-15.763,17.415-15.763" fill="#fff"/>
                <path d="M81.486,130.178,52.2,120.636s-3.5-1.42-2.373-4.64c.232-.664.7-1.229,2.1-2.2,6.489-4.523,120.106-45.36,120.106-45.36s3.208-1.081,5.1-.362a2.766,2.766,0,0,1,1.885,2.055,9.357,9.357,0,0,1,.254,2.585c-.009.752-.1,1.449-.169,2.542-.692,11.165-21.4,94.493-21.4,94.493s-1.239,4.876-5.678,5.043A8.13,8.13,0,0,1,146.1,172.5c-8.711-7.493-38.819-27.727-45.472-32.177a1.27,1.27,0,0,1-.546-.9c-.093-.469.417-1.05.417-1.05s52.426-46.6,53.821-51.492c.108-.379-.3-.566-.848-.4-3.482,1.281-63.844,39.4-70.506,43.607A3.21,3.21,0,0,1,81.486,130.178Z" fill="#fff"/>
            </svg>
            <h1>SECURE LOGIN</h1>
            <p class="subtitle typing">ENTER KEY TO ACCESS CONTROL PANEL</p>
        </div>
        
        <div class="login-form">
            <form id="loginForm">
                <div class="form-group">
                    <label for="accessKey">ACCESS KEY</label>
                    <input type="password" id="accessKey" name="accessKey" placeholder="Enter your access key" required>
                </div>
                <button type="submit" class="submit-btn">GO TO PANEL</button>
            </form>
            
            <div class="telegram-links">
                <a href="https://t.me/REAL_MIJ" target="_blank">CONTACT SUPPORT</a>
                <a href="#" id="reportLink">REPORT ISSUE</a>
                <a href="#" id="channelLink">TELEGRAM CHANNEL</a>
            </div>
        </div>
        
        <div class="footer">
            <p>TELEGRAM REPORTER TOOL v2.0 | SECURE ACCESS SYSTEM</p>
        </div>
    </div>

    <script>
        // Matrix background effect
        const canvas = document.getElementById('matrix-bg');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
        const charArray = chars.split("");
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for(let i = 0; i < columns; i++) {
            drops[i] = 1;
        }
        
        function drawMatrix() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.04)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#00FF00";
            ctx.font = fontSize + "px monospace";
            
            for(let i = 0; i < drops.length; i++) {
                const text = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if(drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                
                drops[i]++;
            }
        }
        
        setInterval(drawMatrix, 35);
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const accessKey = document.getElementById('accessKey').value;
            
            // Simple validation
            if(accessKey.length < 5) {
                alert('Invalid access key. Please try again.');
                return;
            }
            
            // Simulate login process
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.textContent = 'AUTHENTICATING...';
            submitBtn.disabled = true;
            
            setTimeout(() => {
                alert('Access granted! Redirecting to control panel...');
                submitBtn.textContent = 'ACCESS GRANTED';
                // In a real implementation, you would redirect to the panel here
                // window.location.href = 'panel.html';
            }, 2000);
        });
        
        // Telegram links
        document.getElementById('reportLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Opening Telegram to report issue...');
            // In a real implementation, this would open Telegram
            // window.open('https://t.me/REAL_MIJ', '_blank');
        });
        
        document.getElementById('channelLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Opening Telegram channel...');
            // In a real implementation, this would open the Telegram channel
            // window.open('https://t.me/your_channel', '_blank');
        });
        
        // Handle window resize
        window.addEventListener('resize', function() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
